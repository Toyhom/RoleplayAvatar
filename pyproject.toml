[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roleplay-avatar"
version = "0.2.0"
description = "Image-to-character 2D studio with microphone input, streaming speech and expressive avatars"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "websockets>=14,<17", "httpx>=0.28,<1", "Pillow>=11,<12"]

[project.optional-dependencies]
download = ["huggingface-hub>=0.34,<1"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "numpy>=1.26,<3"]

[project.scripts]
avatar = "roleplay_avatar.cli:main"

[project.entry-points."vllm.general_plugins"]
avatar_uuid_devices = "roleplay_avatar.vllm_devices:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.cache/pytest"

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
roleplay_avatar = ["prompt_templates/*.txt", "data/*.json"]
